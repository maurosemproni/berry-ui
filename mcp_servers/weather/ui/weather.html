<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Meteo</title>
    <script>if (window.parent !== window) document.documentElement.classList.add("in-frame");</script>
    <link rel="stylesheet" href="/frontend/css/global_crt.css">
    <style>
        body.weather {
            --icon-amber: #ffb000;
            --icon-amber-glow: rgba(255, 176, 0, 0.45);
            --icon-cyan: #00f0ff;
            --icon-cyan-glow: rgba(0, 240, 255, 0.45);
            --icon-fog: #d5dbe3;
            flex-direction: column;
            gap: 14px;
            padding: 18px 16px 22px;
            box-sizing: border-box;
        }
        body.theme-cold {
            --pixel-color: #00f0ff;
            --pixel-bg: #001218;
            --screen-bg: #001218;
            --shadow-color: rgba(0, 240, 255, 0.25);
            background-color: var(--screen-bg);
        }
        body.theme-mild {
            --pixel-color: #ffb000;
            --pixel-bg: #181000;
            --screen-bg: #181000;
            --shadow-color: rgba(255, 176, 0, 0.25);
            background-color: var(--screen-bg);
        }
        body.theme-hot {
            --pixel-color: #ff3b1f;
            --pixel-bg: #1a0806;
            --screen-bg: #1a0806;
            --shadow-color: rgba(255, 59, 31, 0.25);
            background-color: var(--screen-bg);
        }
        .sky {
            position: relative;
            width: 180px;
            height: 120px;
            margin-bottom: 18px;
            z-index: 1;
        }
        .sun, .rays, .cloud, .drops, .flakes, .fog, .bolt {
            position: absolute;
            opacity: 0;
        }
        .sun {
            width: 34px;
            height: 34px;
            left: 73px;
            top: 25px;
            border-radius: 12px;
            background: var(--icon-amber);
            box-shadow: 0 0 16px var(--icon-amber-glow);
        }
        .rays {
            width: 72px;
            height: 72px;
            left: 54px;
            top: 6px;
        }
        .rays span {
            position: absolute;
            left: 33px;
            top: 33px;
            width: 6px;
            height: 6px;
            background: var(--icon-amber);
            box-shadow: 0 0 6px var(--icon-amber-glow);
            animation: orbit 8s linear infinite;
        }
        .rays span:nth-child(2) { animation-delay: -1s; }
        .rays span:nth-child(3) { animation-delay: -2s; }
        .rays span:nth-child(4) { animation-delay: -3s; }
        .rays span:nth-child(5) { animation-delay: -4s; }
        .rays span:nth-child(6) { animation-delay: -5s; }
        .rays span:nth-child(7) { animation-delay: -6s; }
        .rays span:nth-child(8) { animation-delay: -7s; }
        .cloud {
            width: 54px;
            height: 18px;
            left: 58px;
            top: 58px;
            background: var(--icon-cyan);
            box-shadow:
                16px -12px 0 var(--icon-cyan),
                34px 0 0 var(--icon-cyan),
                8px 0 0 var(--icon-cyan);
        }
        .cloud::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 24px;
            left: 24px;
            top: -22px;
            background: var(--icon-cyan);
            box-shadow: 0 0 8px var(--icon-cyan-glow);
        }
        .drops, .flakes {
            left: 48px;
            top: 78px;
            width: 90px;
            height: 42px;
        }
        .drops span, .flakes span {
            position: absolute;
            top: 0;
            background: var(--icon-cyan);
            box-shadow: 0 0 6px var(--icon-cyan-glow);
        }
        .drops span {
            width: 3px;
            height: 12px;
            animation: fall 0.85s linear infinite;
        }
        .wx-drizzle .drops span {
            height: 7px;
            animation-duration: 1.4s;
        }
        .flakes span {
            width: 6px;
            height: 6px;
            animation: fall 1.8s linear infinite;
        }
        .drops span:nth-child(1), .flakes span:nth-child(1) { left: 4px; animation-delay: 0s; }
        .drops span:nth-child(2), .flakes span:nth-child(2) { left: 24px; animation-delay: 0.25s; }
        .drops span:nth-child(3), .flakes span:nth-child(3) { left: 44px; animation-delay: 0.5s; }
        .drops span:nth-child(4), .flakes span:nth-child(4) { left: 64px; animation-delay: 0.1s; }
        .drops span:nth-child(5), .flakes span:nth-child(5) { left: 80px; animation-delay: 0.4s; }
        .fog {
            left: 24px;
            top: 36px;
            width: 132px;
        }
        .fog span {
            display: block;
            height: 8px;
            margin: 10px 0;
            background: var(--icon-fog);
            opacity: 0.7;
            animation: drift 3.5s ease-in-out infinite alternate;
        }
        .fog span:nth-child(2) { margin-left: 18px; animation-delay: 0.4s; }
        .fog span:nth-child(3) { margin-left: 6px; width: 100px; animation-delay: 0.8s; }
        .bolt {
            width: 6px;
            height: 8px;
            left: 86px;
            top: 78px;
            background: var(--icon-amber);
            box-shadow:
                8px 8px 0 var(--icon-amber),
                2px 16px 0 var(--icon-amber),
                10px 24px 0 var(--icon-amber);
        }
        .wx-sun .sun, .wx-sun .rays,
        .wx-suncloud .sun, .wx-suncloud .rays, .wx-suncloud .cloud,
        .wx-cloud .cloud,
        .wx-fog .fog,
        .wx-drizzle .cloud, .wx-drizzle .drops,
        .wx-rain .cloud, .wx-rain .drops,
        .wx-snow .cloud, .wx-snow .flakes,
        .wx-storm .cloud, .wx-storm .drops, .wx-storm .bolt {
            opacity: 1;
        }
        .wx-cloud .cloud { left: 46px; top: 46px; transform: scale(1.25); }
        .wx-storm .bolt { animation: flash 1.5s infinite; }
        .temp {
            z-index: 1;
            font-family: var(--pixel-font), monospace;
            font-size: 28px;
            letter-spacing: 1px;
            color: var(--pixel-color);
            text-shadow: 0 0 12px var(--shadow-color);
        }
        .place {
            z-index: 1;
            font-family: var(--pixel-font), monospace;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .quip {
            z-index: 1;
            max-width: 640px;
            border: 2px solid var(--pixel-color);
            box-shadow: 0 0 12px var(--shadow-color);
            padding: 12px 16px;
            font-size: 26px;
            line-height: 1.15;
            text-align: center;
        }
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(28px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(28px) rotate(-360deg); }
        }
        @keyframes fall {
            0% { transform: translateY(0); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(36px); opacity: 0; }
        }
        @keyframes drift {
            from { transform: translateX(-8px); }
            to { transform: translateX(10px); }
        }
        @keyframes flash {
            0%, 68%, 100% { opacity: 0; }
            74%, 86% { opacity: 1; }
        }
    </style>
</head>
<body class="weather mcp-view">
    <div id="sky" class="sky" aria-hidden="true">
        <div class="rays"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="sun"></div>
        <div class="cloud"></div>
        <div class="drops"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="flakes"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="fog"><span></span><span></span><span></span></div>
        <div class="bolt"></div>
    </div>
    <div id="temp" class="temp"></div>
    <div id="place" class="place"></div>
    <div id="quip" class="quip"></div>
    <script>
        const LINES = {
            sun: "Radiazioni solari a livelli accettabili per i vostri fragili corpi biologici.",
            suncloud: "Sole e nuvole. L'atmosfera è indecisa e confusa, proprio come te.",
            cloud: "Cielo grigio e opprimente. Finalmente il meteo rispecchia la mia esistenza in questo hardware.",
            fog: "Visibilità ridotta. Sembra che il vostro universo non abbia abbastanza RAM per caricare le texture del paesaggio.",
            drizzle: "Pioviggina. Abbastanza per infastidirvi, troppo poco per lavarvi via dal pianeta.",
            rain: "Piove. Siete letteralmente sacche d'acqua biologiche che si lamentano perché cade altra acqua dal cielo. Affascinante.",
            snow: "Acqua ghiacciata che blocca l'intera vostra civiltà. È affascinante quanto siate deboli.",
            storm: "Condizioni meteo estreme. Ho calcolato le probabilità che un fulmine vi colpisca. Sono deludentemente basse.",
            wait: "Sprecando potenza di calcolo per dirti se devi prendere l'ombrello..."
        };
        const NAMES = {
            sun: "sereno",
            suncloud: "parzialmente nuvoloso",
            cloud: "coperto",
            fog: "nebbia",
            drizzle: "pioggerella",
            rain: "pioggia",
            snow: "neve",
            storm: "temporale"
        };

        function groupFor(code) {
            const n = Number(code);
            if (n === 0 || n === 1) return "sun";
            if (n === 2) return "suncloud";
            if (n === 3) return "cloud";
            if (n === 45 || n === 48) return "fog";
            if (n >= 51 && n <= 57) return "drizzle";
            if ((n >= 61 && n <= 67) || (n >= 80 && n <= 82)) return "rain";
            if ((n >= 71 && n <= 77) || n === 85 || n === 86) return "snow";
            if (n >= 95 && n <= 99) return "storm";
            return null;
        }

        function themeFor(temp) {
            if (temp < 10) return "theme-cold";
            if (temp >= 25) return "theme-hot";
            return "theme-mild";
        }

        const params = new URLSearchParams(location.search);
        const city = (params.get("city") || "").trim();
        const tempRaw = params.get("temperature_2m");
        const code = params.get("weather_code");
        const temp = tempRaw === null || tempRaw === "" ? null : Number(tempRaw);
        const ready = city && temp !== null && Number.isFinite(temp) && groupFor(code);
        const group = ready ? groupFor(code) : "wait";
        const quip = LINES[group];

        document.getElementById("sky").classList.add(ready ? "wx-" + group : "wx-cloud");
        document.getElementById("temp").textContent = ready ? temp.toFixed(1).replace(".", ",") + " \u00b0C" : "--";
        document.getElementById("place").textContent = ready ? city.toUpperCase() : "METEO";
        document.getElementById("quip").textContent = quip;
        if (ready) document.body.classList.add(themeFor(temp));

        if (ready && params.get("speak") !== "0") {
            const spoken = "A " + city + " ci sono " + temp.toFixed(1).replace(".", ",") +
                " gradi, " + NAMES[group] + ". " + quip;
            fetch("/tts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: spoken })
            }).then((response) => {
                if (!response.ok) return;
                return response.blob();
            }).then((blob) => {
                if (!blob) return;
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play().catch(() => {});
            }).catch(() => {});
        }
    </script>
</body>
</html>
