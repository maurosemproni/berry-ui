<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Berry Telemetry</title>
    <script>if (window.parent !== window) document.documentElement.classList.add("in-frame");</script>
    <link rel="stylesheet" href="/frontend/css/global_crt.css">
    <style>
        body.telemetry {
            --pixel-color: #33ff00;
            --shadow-color: rgba(51, 255, 0, 0.25);
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding: 12px 16px 0;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            border-bottom: 2px solid var(--pixel-color);
            padding-bottom: 8px;
            font-family: var(--pixel-font);
            font-size: 13px;
            letter-spacing: 1px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
            width: 100%;
        }
        .box {
            border: 1px solid var(--pixel-color);
            box-shadow: 0 0 12px var(--shadow-color);
            padding: 10px 12px;
        }
        h3 {
            margin: 0 0 8px;
            font-family: var(--pixel-font);
            font-size: 10px;
        }
        .bar-container {
            width: 100%;
            background: #002200;
            height: 16px;
            margin: 6px 0 10px;
            border: 1px solid var(--pixel-color);
        }
        .bar {
            height: 100%;
            background: repeating-linear-gradient(45deg, var(--pixel-color), var(--pixel-color) 10px, #002200 10px, #002200 20px);
            width: 0%;
            transition: width 0.5s;
        }
        .log {
            font-size: 22px;
            line-height: 1.2;
            margin-top: 4px;
        }
        .burn { color: #ff3333; }
        .blink { animation: blinker 1s steps(1) infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body class="telemetry mcp-view">
    <h1>SYSTEM DIAGNOSTICS <span class="blink">_</span></h1>
    <div class="grid">
        <div class="box">
            <h3>HARDWARE STRESS</h3>
            <div class="log">CPU: <span id="cpu-val">0</span>%</div>
            <div class="bar-container"><div id="cpu-bar" class="bar"></div></div>
            <div class="log">RAM: <span id="ram-val">0</span>%</div>
            <div class="bar-container"><div id="ram-bar" class="bar"></div></div>
            <div class="log">TEMP CORE: <span id="temp-val">--</span> °C</div>
        </div>
        <div class="box">
            <h3>LATENCY PIPELINE (MS)</h3>
            <div class="log">WAKE WORD: <span id="wake-ms">0</span> ms</div>
            <div class="log">VOSK STT : <span id="stt-ms">0</span> ms</div>
            <div class="log">LLM GEMINI: <span id="llm-ms">0</span> ms</div>
            <div class="log">AUDIO TTS: <span id="tts-ms">0</span> ms</div>
            <div class="log burn">TOKEN BRUCIATI: <span id="token-val">0</span></div>
            <div class="log">RISPOSTA MEDIA: <span id="reply-avg">0</span> s</div>
        </div>
    </div>
    <script>
        async function fetchMetrics() {
            try {
                const res = await fetch("/api/telemetry");
                const data = await res.json();
                document.getElementById("cpu-val").innerText = data.hardware.cpu;
                document.getElementById("cpu-bar").style.width = data.hardware.cpu + "%";
                document.getElementById("ram-val").innerText = data.hardware.ram;
                document.getElementById("ram-bar").style.width = data.hardware.ram + "%";
                document.getElementById("temp-val").innerText = data.hardware.temp;
                document.getElementById("wake-ms").innerText = data.latency_pipeline.wake_word_ms;
                document.getElementById("stt-ms").innerText = data.latency_pipeline.stt_ms;
                document.getElementById("llm-ms").innerText = data.latency_pipeline.llm_ms;
                document.getElementById("tts-ms").innerText = data.latency_pipeline.tts_ms;
                document.getElementById("token-val").innerText = data.latency_pipeline.tokens;
                document.getElementById("reply-avg").innerText = data.latency_pipeline.reply_avg_s;
            } catch (e) {
                console.error("In attesa del server telemetrico...");
            }
        }
        setInterval(fetchMetrics, 2000);
        fetchMetrics();
    </script>
</body>
</html>
