<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Berry</title>
    <link rel="stylesheet" href="/frontend/css/global_crt.css">
    <style>
        #view-frame,
        #weather-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
        }
        #view-frame { z-index: 1; }
        #weather-frame { z-index: 3; }
        #weather-frame[hidden] { display: none; }
        body::before {
            z-index: 2;
        }
    </style>
    <script>
        let mcpOpen = false;
        let lastFaceStatus = "[STATUS: SLEEP]";
        let lastStatusLabel = "SLEEP";
        let latchedCommand = "";
        let weatherTimer = null;
        let glitchToken = 0;
        let mcpReveal = null;

        function postFaceGlitch() {
            const frame = document.getElementById("view-frame");
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({ type: "berry-glitch" }, window.location.origin);
            }
        }

        function whenFaceGlitchDone(done) {
            const token = ++glitchToken;
            let settled = false;
            const finish = () => {
                if (settled) return;
                settled = true;
                window.removeEventListener("message", onGlitchDone);
                clearTimeout(giveUp);
                if (token !== glitchToken) return;
                done();
            };
            const onGlitchDone = (event) => {
                if (event.origin !== window.location.origin) return;
                const data = event.data || {};
                if (data.type === "berry-glitch-done") finish();
            };
            window.addEventListener("message", onGlitchDone);
            const giveUp = setTimeout(finish, 800);
            postFaceGlitch();
        }

        function showMcpFrame(url, manifestUrl, duration) {
            const weatherFrame = document.getElementById("weather-frame");
            mcpOpen = true;
            latchedCommand = "";
            setLogInput("");
            setLogStatus("SERVER MCP: WEATHER");
            readJson(manifestUrl + "?t=" + Date.now()).then((data) => {
                if (!mcpOpen) return;
                const title = data && String(data.title || "").trim();
                setLogStatus("SERVER MCP: " + (title || "WEATHER"));
            });
            pollMcpCommand();
            weatherFrame.hidden = false;
            weatherFrame.src = url;
            if (weatherTimer) clearTimeout(weatherTimer);
            weatherTimer = setTimeout(closeMcp, duration);
        }

        function setLogInput(value) {
            const line = document.getElementById("log-input");
            const target = document.getElementById("log-input-text");
            if (!line || !target) return;
            const text = String(value || "").trim();
            target.textContent = text;
            line.classList.toggle("has-text", text.length > 0);
        }

        function setLogStatus(text) {
            const status = document.getElementById("log-status");
            if (status) status.textContent = text;
        }

        window.addEventListener("message", (event) => {
            if (event.origin !== window.location.origin) return;
            const data = event.data || {};
            if (data.type === "berry-log" && typeof data.status === "string") {
                const labelMatch = /^\[STATUS: ([A-Z]+)\]/.exec(data.status);
                const label = labelMatch ? labelMatch[1] : "";
                const replyDone = label === "IDLE" && (lastStatusLabel === "THINKING" || lastStatusLabel === "SPEAKING" || lastStatusLabel === "HAPPY");
                lastFaceStatus = data.status;
                if (!mcpOpen) setLogStatus(lastFaceStatus);
                if (!mcpOpen && replyDone) setLogInput("");
                lastStatusLabel = label;
                return;
            }
            if (data.type === "berry-input" && !mcpOpen) setLogInput(data.text);
        });

        function readJson(url) {
            return fetch(url, { cache: "no-store" })
                .then((res) => res.ok ? res.json() : null)
                .catch(() => null);
        }

        function latchCommand(command) {
            const text = String(command || "").trim();
            if (!mcpOpen || !text || text === latchedCommand) return;
            latchedCommand = text;
            setLogInput(text);
        }

        let commandReady = false;
        let seenCommandAt = 0;
        function pollMcpCommand() {
            readJson("/wake-state.json?t=" + Date.now()).then((data) => {
                if (!data) return;
                const command = String(data.command || "").trim();
                const at = typeof data.command_at === "number" ? data.command_at : 0;
                if (!commandReady) {
                    commandReady = true;
                    seenCommandAt = at;
                    return;
                }
                if (mcpOpen) {
                    if (at !== seenCommandAt) seenCommandAt = at;
                    latchCommand(command);
                    return;
                }
                if (!command || at === seenCommandAt) return;
                seenCommandAt = at;
                setLogInput(command);
            });
        }

        function openMcp(url, manifestUrl, duration) {
            const weatherFrame = document.getElementById("weather-frame");
            const already = mcpOpen && weatherFrame && !weatherFrame.hidden;
            if (already) {
                if (weatherTimer) clearTimeout(weatherTimer);
                weatherTimer = setTimeout(closeMcp, duration);
                return;
            }
            if (mcpReveal) {
                mcpReveal.url = url;
                mcpReveal.manifestUrl = manifestUrl;
                mcpReveal.duration = duration;
                return;
            }
            mcpReveal = { url: url, manifestUrl: manifestUrl, duration: duration };
            whenFaceGlitchDone(() => {
                const pending = mcpReveal;
                mcpReveal = null;
                if (!pending) return;
                showMcpFrame(pending.url, pending.manifestUrl, pending.duration);
            });
        }

        function closeMcp() {
            if (weatherTimer) clearTimeout(weatherTimer);
            weatherTimer = null;
            mcpReveal = null;
            glitchToken += 1;
            mcpOpen = false;
            const weatherFrame = document.getElementById("weather-frame");
            weatherFrame.hidden = true;
            weatherFrame.src = "about:blank";
            setLogStatus(lastFaceStatus);
            setLogInput("");
            postFaceGlitch();
        }
    </script>
</head>
<body>
    <iframe id="view-frame" src="/frontend/views/berry_face.html" title="Berry"></iframe>
    <iframe id="weather-frame" title="Meteo" hidden></iframe>
    <div class="retro-log" aria-live="polite">
        <div id="log-status">[STATUS: SLEEP]</div>
        <div id="log-input">
            <span class="log-label">[INPUT_USER]: </span><span id="log-input-text"></span><span class="log-cursor">_</span>
        </div>
    </div>
    <script>
        const FACE_URL = "/frontend/views/berry_face.html";
        const frame = document.getElementById("view-frame");
        let returnTimer = null;

        function switchView(url, duration = null) {
            if (returnTimer) {
                clearTimeout(returnTimer);
                returnTimer = null;
            }
            frame.src = url;
            if (typeof duration === "number" && duration > 0) {
                returnTimer = setTimeout(() => {
                    returnTimer = null;
                    frame.src = FACE_URL;
                }, duration);
            }
        }

        function showWeather(url, duration = 14000) {
            openMcp(url, "/mcp_servers/weather/ui_manifest.json", duration);
        }

        let seenWeatherSeq = null;
        let weatherReady = false;
        function watchWeather() {
            fetch("/weather-state.json?t=" + Date.now(), { cache: "no-store" })
                .then((res) => res.ok ? res.json() : null)
                .then((data) => {
                    const seq = data && typeof data.seq === "number" ? data.seq : null;
                    if (!weatherReady) {
                        weatherReady = true;
                        seenWeatherSeq = seq;
                        return;
                    }
                    if (seq === null || seq === seenWeatherSeq) return;
                    seenWeatherSeq = seq;
                    const params = new URLSearchParams({
                        city: String(data.city || ""),
                        temperature_2m: String(data.temperature_2m),
                        weather_code: String(data.weather_code)
                    });
                    params.set("speak", "0");
                    showWeather("/mcp_servers/weather/ui/weather.html?" + params.toString(), 14000);
                })
                .catch(() => {});
        }
        setInterval(watchWeather, 500);
        watchWeather();
        setInterval(pollMcpCommand, 500);
    </script>
</body>
</html>
